# Deploy this Worker from the repository root with:
# npx wrangler deploy --config backend/cloudflare/wrangler.toml
# Do not commit secret values.
name = "civora-publisher"
main = "worker.mjs"
compatibility_date = "2026-11-09"

[vars]
ALLOWED_ORIGIN = "https://willn0tbill.github.io"
FIREBASE_PROJECT_ID = "REPLACE_WITH_DEDICATED_FIREBASE_PROJECT_ID"

# Required Worker secrets (configure in Cloudflare dashboard or Wrangler):
# GITHUB_TOKEN — repo-scoped Contents: Read and write, stored on the Worker only
# STAFF_UIDS — comma-separated Firebase Auth UIDs allowed to publish
