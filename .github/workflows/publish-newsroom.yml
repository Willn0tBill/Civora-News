name: Publish Civora newsroom articles

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: civora-newsroom-publication
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Synchronize published articles from Civora's Supabase database
        run: node scripts/sync-supabase.mjs
      - name: Verify generated pages and article links
        run: |
          node scripts/build.mjs --check
          node tests/site.test.mjs
          node tests/editorial-voice.test.mjs
          node tests/archive.test.mjs
      - name: Commit publication and archive updates
        id: publication
        run: |
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo "No publication or archive changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "civora-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "publish: sync Civora articles and date-based archives"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request a GitHub Pages rebuild for scheduled updates
        # Bot commits made with GITHUB_TOKEN do not automatically trigger
        # branch-based Pages builds. Request the Pages build explicitly.
        if: steps.publication.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /dev/null
          echo "GitHub Pages rebuild requested."
