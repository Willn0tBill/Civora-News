name: Civora production health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"

permissions:
  contents: read

concurrency:
  group: civora-production-health
  cancel-in-progress: true

jobs:
  live-site:
    name: Check public website and HTTPS
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify HTTPS, website, assets and recovery
        shell: bash
        run: |
          set -euo pipefail
          root="https://civoranews.org"
          mkdir -p /tmp/civora-health

          get() {
            local route="$1"
            local output="$2"
            curl --fail --silent --show-error --location --max-time 22 --retry 2 --retry-delay 3 \
              --proto-redir =https --output "$output" "$root$route"
            test -s "$output"
          }

          get "/" /tmp/civora-health/home.html
          grep -q 'CIVORA' /tmp/civora-health/home.html
          grep -q 'class="flip-grid"' /tmp/civora-health/home.html

          get "/search/" /tmp/civora-health/search.html
          grep -q 'id="site-search"' /tmp/civora-health/search.html

          get "/discover/" /tmp/civora-health/discover.html
          grep -q 'id="quiz-stage"' /tmp/civora-health/discover.html
          grep -q 'data-discover-item' /tmp/civora-health/discover.html
          grep -q 'id="saved-stories"' /tmp/civora-health/discover.html

          get "/article/ai-literacy/" /tmp/civora-health/article.html
          grep -q 'Editorial sample' /tmp/civora-health/article.html

          get "/assets/site.css" /tmp/civora-health/site.css
          get "/assets/site.js" /tmp/civora-health/site.js
          get "/assets/reading-room.css" /tmp/civora-health/reader.css
          get "/assets/reading.js" /tmp/civora-health/reader.js
          get "/assets/discover.css" /tmp/civora-health/discover.css
          get "/assets/discover.js" /tmp/civora-health/discover.js
          get "/sitemap.xml" /tmp/civora-health/sitemap.xml
          grep -q 'https://civoranews.org/' /tmp/civora-health/sitemap.xml
          if grep -q 'willn0tbill.github.io/Civora-News/' /tmp/civora-health/sitemap.xml; then
            echo 'Sitemap still advertises the old GitHub Pages address' >&2
            exit 1
          fi

          status="$(curl --silent --show-error --location --output /tmp/civora-health/404.html \
            --write-out '%{http_code}' --max-time 20 "$root/audited-not-found-route-404/")"
          test "$status" = "404"
          grep -q 'This story isn' /tmp/civora-health/404.html
          echo "PASS: custom-domain HTTPS, homepage, search, article, assets, sitemap and 404"
