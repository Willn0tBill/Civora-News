name: Publish newsroom content

on:
  push:
    branches: [main]
    paths:
      - 'content/articles.json'
      - 'tools/publish.mjs'
      - 'templates/article.html'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate content and generate pages
        run: node tools/publish.mjs
      - name: Commit generated website content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles.json article
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: publish verified newsroom content"
            git push
          fi
