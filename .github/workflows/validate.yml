name: Validate Civora site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated website matches article content
        run: node scripts/build.mjs --check
      - name: Validate pages and internal links
        run: node tests/site.test.mjs
      - name: Validate responsive layouts and touch interactions
        run: node tests/mobile.test.mjs
      - name: Verify Reading Room and article engagement
        run: |
          node --check assets/reading.js
          node --check assets/discover.js
          node tests/reading-room.test.mjs
      - name: Verify Studio builds exact published HTML
        run: node tests/studio.test.mjs
      - name: Verify staged secure Studio and Worker
        run: |
          node --check studio/secure/studio.mjs
          node --check backend/cloudflare/worker.mjs
          node tests/secure-studio.test.mjs
