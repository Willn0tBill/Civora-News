name: Validate Civora site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated website matches article content
        run: node scripts/build.mjs --check
      - name: Validate AdSense integration and privacy disclosure
        run: node tests/adsense.test.mjs
      - name: Validate all four configurable AdSense formats
        run: |
          node --check assets/ads-config.js
          node --check assets/ad-units.js
          node tests/ad-units.test.mjs
      - name: Validate pages and internal links
        run: node tests/site.test.mjs
      - name: Validate responsive layouts and touch interactions
        run: node tests/mobile.test.mjs
      - name: Verify Reading Room and article engagement
        run: |
          node --check assets/reading.js
          node --check assets/discover.js
          node tests/reading-room.test.mjs
      - name: Validate editorial front page and reading paths
        run: |
          node --check assets/frontpage.js
          node tests/frontpage.test.mjs
      - name: Verify published journalism and source transparency
        run: node tests/editorial.test.mjs
      - name: Verify Studio builds exact published HTML
        run: node tests/studio.test.mjs
      - name: Validate PPW-style Supabase newsroom
        run: |
          node --check studio/newsroom.js
          node --check assets/live-news.js
          node --check assets/live-story.js
          node --check scripts/sync-supabase.mjs
          node --check backend/cloudflare/worker.mjs
          node tests/secure-studio.test.mjs
          node tests/studio-workflow.test.mjs
